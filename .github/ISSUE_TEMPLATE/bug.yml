name: Bug
description: Something looks or works wrong.
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: The skin or page, for example button-glass or the Theming page.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you see, and what you expected instead. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      placeholder: |
        1. Open ...
        2. Press ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Light
        - Dark
        - Both
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari 19 on an iPhone
